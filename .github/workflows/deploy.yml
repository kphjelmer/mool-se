name: Deploy to Loopia (mool.se)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SFTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy child theme via SFTP
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
          set sftp:auto-confirm yes
          set net:timeout 30
          set net:max-retries 3
          open sftp://ninakp:$FTP_PASSWORD@ftpcluster.loopia.se
          mirror \
            --reverse \
            --delete \
            --verbose \
            wp-content/themes/twentytwentyfour-child/ \
            /public_html/wp-content/themes/twentytwentyfour-child/
          bye
          "
