name: Deploy to Loopia (mool.se)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Needed for change detection

      - name: Deploy via FTP to Loopia
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftpcluster.loopia.se
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/wp-content/uploads/**
            **/wp-content/cache/**
            **/wp-content/upgrade/**
            **/wp-content/backup*/**
            **/*.log
            **/.DS_Store
            **/Thumbs.db
            **/phpinfo*.php
            **/debug*.log
