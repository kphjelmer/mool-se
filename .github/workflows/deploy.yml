name: Deploy to Loopia (mool.se)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy child theme via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpcluster.loopia.se
          username: ninakp
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: wp-content/themes/twentytwentyfour-child/
          server-dir: /public_html/wp-content/themes/twentytwentyfour-child/

      - name: Deploy mu-plugins via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpcluster.loopia.se
          username: ninakp
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: wp-content/mu-plugins/
          server-dir: /public_html/wp-content/mu-plugins/
